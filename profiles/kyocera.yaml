# Perfil-base Kyocera (PROMPT seção 6.4). Estrutura pronta; os OIDs proprietários ficam
# PREENCHER_PELO_WALK até existir uma gravação real do modelo (dm-tool walk / tela Perfis de modelos).
# Enquanto isso, a fonte "standard" garante o total (prtMarkerLifeCount). Nenhum OID é inventado.
id: kyocera
version: 1
description: Kyocera — perfil-base; contadores PB/cor a preencher a partir de walk real

match:
  sys_object_id_prefix: "1.3.6.1.4.1.1347"

identity:
  serial:
    - { oid: "1.3.6.1.2.1.43.5.1.1.17.1" }   # prtGeneralSerialNumber
    - { oid: "PREENCHER_PELO_WALK", note: "serial proprietário, se o padrão vier vazio" }
  model:
    - { oid: "1.3.6.1.2.1.25.3.2.1.3.1" }    # hrDeviceDescr

counter_sources:
  - name: kyocera_counters
    detect_oid: "PREENCHER_PELO_WALK"
    counters:
      total: { oid: "PREENCHER_PELO_WALK", note: "total conferido com a folha de contadores" }
      mono:  { oid: "PREENCHER_PELO_WALK", note: "PB conferido com a folha de contadores" }
      color: { oid: "PREENCHER_PELO_WALK", note: "cor conferida com a folha de contadores" }
    store_all_rows_in_extra: true

  - name: standard
    counters:
      total: { oid: "1.3.6.1.2.1.43.10.2.1.4.1.1" }   # prtMarkerLifeCount

rules:
  validate_sum_tolerance_percent: 2

status:
  energy_saving_text_regex: "(?i)sleep|economia|energy|saving|repouso|power save|standby"
supplies:
  use_standard: true

# Ritmo e tolerância das consultas SNMP (rede real, 05/10/2026). A ECOSYS M3655idn do escritório
# (10.10.10.147) perde cerca de 50% dos pacotes, inclusive ping, enquanto as outras impressoras pelo mesmo
# caminho perdem 0%: a perda é no link dela (cabo, porta do switch, duplex), não no SNMP. Medido na leitura
# completa: com 1 nova tentativa (padrão), 0 de 5 leituras; com 4, 5 de 5, todas com total 63.488.
# Intervalo entre requisições (até 1 s) não reduziu a perda, e lote menor só aumenta o número de pacotes
# (5/5 também, porém mais lento). Fica: 6 novas tentativas de 1 s, lote padrão, sem intervalo.
snmp:
  models:
    - model_regex: "(?i)ECOSYS M3655idn"
      note: "perda de ~50% dos pacotes no link da impressora; mais tentativas curtas mantêm a leitura estável"
      retries: 6
      timeout_ms: 1000
      request_interval_ms: 0
