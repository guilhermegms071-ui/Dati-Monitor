name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dati
          POSTGRES_PASSWORD: dati-ci
          POSTGRES_DB: dati_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dati -d dati_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_test
      TEST_DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_test
      APP_ENV: test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go — generate sem diferenças
        working-directory: agent
        run: go generate ./... && git diff --exit-code -- internal/product/product_gen.go
      - name: Go — golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: agent
          args: --build-tags integration
      - name: Python — venv (também usado pelos testes Go de integração com o snmpsim)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.lock
          .venv/bin/pip install --no-deps -e backend
      - name: Go — testes com -race (unitários + snmpsim) e cobertura >= 80% em internal/
        working-directory: agent
        run: |
          go test -race -count=1 -tags integration -coverprofile=cover.out -coverpkg=./internal/... ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Cobertura internal/: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) }'

      - name: Python — ruff e mypy --strict
        working-directory: backend
        run: |
          PY_SCRIPTS="../scripts/smtp_catcher.py ../scripts/sleepy_udp_proxy.py ../scripts/gen_protocol_docs.py ../scripts/gen_openapi.py ../scripts/e2e_seed.py ../scripts/e2e_sims.py ../scripts/chaos.py ../profiles/recordings/sim/generate.py"
          ../.venv/bin/ruff check app tests alembic $PY_SCRIPTS
          ../.venv/bin/ruff format --check app tests alembic $PY_SCRIPTS
          ../.venv/bin/mypy --strict app tests $PY_SCRIPTS
      - name: OpenAPI — openapi.json do portal atualizado
        working-directory: backend
        run: ../.venv/bin/python ../scripts/gen_openapi.py --check
      - name: Python — pytest (PostgreSQL real) com cobertura >= 80%
        working-directory: backend
        run: ../.venv/bin/python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Frontend — dependências
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint, formato, tipos e Vitest
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run api:check
          npm test
      - name: Frontend — Playwright E2E
        working-directory: frontend
        run: |
          (cd ../backend && ../.venv/bin/python -m app.cli migrate)
          npx playwright install --with-deps chromium
          npx playwright test

  windows:
    name: Windows — build dos agentes e testes Go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Build de todos os alvos
        shell: pwsh
        run: scripts/build-agent.ps1 -Version 0.0.0-ci
      - name: Binário roda
        shell: pwsh
        run: dist/windows-amd64/dm-agent.exe version
      - name: Testes Go com -race
        working-directory: agent
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
