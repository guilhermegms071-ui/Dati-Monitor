name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dati
          POSTGRES_PASSWORD: dati-ci
          POSTGRES_DB: dati_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dati -d dati_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_test
      TEST_DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_test
      APP_ENV: test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Go — generate sem diferenças
        working-directory: agent
        run: go generate ./... && git diff --exit-code -- internal/product/product_gen.go
      - name: Go — golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: agent
          args: --build-tags integration
      - name: Python — venv (também usado pelos testes Go de integração com o snmpsim)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.lock
          .venv/bin/pip install --no-deps -e backend
      - name: Go — testes com -race (unitários + snmpsim) e cobertura >= 80% em internal/
        working-directory: agent
        run: |
          go test -race -count=1 -tags integration -coverprofile=cover.out -coverpkg=./internal/... ./...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Cobertura internal/: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p < 80) }'

      - name: Python — ruff e mypy --strict
        working-directory: backend
        run: |
          PY_SCRIPTS="../scripts/smtp_catcher.py ../scripts/sleepy_udp_proxy.py ../scripts/gen_protocol_docs.py ../scripts/gen_openapi.py ../scripts/e2e_seed.py ../scripts/e2e_sims.py ../scripts/chaos.py ../scripts/printer_web_sim.py ../scripts/build_linux.py ../scripts/ci_enrollment_code.py ../scripts/soak.py ../scripts/load.py ../profiles/recordings/sim/generate.py"
          ../.venv/bin/ruff check app tests alembic $PY_SCRIPTS
          ../.venv/bin/ruff format --check app tests alembic $PY_SCRIPTS
          ../.venv/bin/mypy --strict app tests $PY_SCRIPTS
      - name: OpenAPI — openapi.json do portal atualizado
        working-directory: backend
        run: ../.venv/bin/python ../scripts/gen_openapi.py --check
      - name: Python — pytest (PostgreSQL real) com cobertura >= 80%
        working-directory: backend
        run: ../.venv/bin/python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Frontend — dependências
        working-directory: frontend
        run: npm ci
      - name: Frontend — lint, formato, tipos e Vitest
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run api:check
          npm test
      - name: Frontend — Playwright E2E
        working-directory: frontend
        run: |
          (cd ../backend && ../.venv/bin/python -m app.cli migrate)
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Pacote Linux — .deb instalado pelo install.sh, cadastrado e rodando no systemd
        run: |
          set -e
          pwsh scripts/build-agent.ps1 -Version 0.0.0-ci -Targets linux/amd64
          .venv/bin/python scripts/build_linux.py --version 0.0.0-ci --arch amd64
          DEB=dist/installers/dati-monitor-agent_0.0.0~ci_amd64.deb
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          (cd backend && ../.venv/bin/python -m app.cli migrate)
          (cd backend && ../.venv/bin/python -m uvicorn app.api.main:create_app --factory --port 8000 > ../api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          CODE=$(.venv/bin/python scripts/ci_enrollment_code.py)
          curl -fsSL "http://127.0.0.1:8000/api/public/install.sh?code=$CODE" -o install.sh
          sudo sh install.sh --package "$DEB"
          sleep 5
          systemctl is-active DatiMonitorAgent DatiMonitorWatchdog
          grep -q "Restart=always" /etc/systemd/system/DatiMonitorAgent.service
          sudo dm-agent status
          sudo dpkg -P dati-monitor-agent
          test ! -e /etc/systemd/system/DatiMonitorAgent.service
          test ! -e /var/lib/dati-monitor
          echo "pacote Linux: instalação, serviços e remoção OK"

  soak-load:
    name: Resistência (soak 30 min) e carga (20.000 equipamentos, 500 WebSockets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dati
          POSTGRES_PASSWORD: dati-ci
          POSTGRES_DB: dati_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dati -d dati_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_dev
      TEST_DATABASE_URL: postgresql+asyncpg://dati:dati-ci@127.0.0.1:5432/dati_dev
      POSTGRES_SUPERUSER: dati
      POSTGRES_SUPERUSER_PASSWORD: dati-ci
      APP_ENV: test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
      PUBLIC_SERVER_URL: http://127.0.0.1:8000
      PUBLIC_WS_URL: ws://127.0.0.1:8001/ws/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Servidor, gateway e impressoras simuladas
        run: |
          set -e
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.lock
          .venv/bin/pip install --no-deps -e backend
          (cd backend && ../.venv/bin/python -m app.cli migrate && ../.venv/bin/python -m app.cli seed-dev)
          (cd backend && ../.venv/bin/python -m uvicorn app.api.main:create_app --factory --port 8000 > ../api.log 2>&1 &)
          (cd backend && ../.venv/bin/python -m uvicorn app.gateway.main:create_app --factory --port 8001 --ws websockets-sansio > ../gateway.log 2>&1 &)
          for d in profiles/recordings/sim/0*-*/; do
            n=$(basename "$d" | cut -c1-2); port=$((1160 + 10#$n))
            .venv/bin/snmpsim-command-responder --data-dir="$d" --cache-dir="var/snmpsim-cache/$n" --agent-udpv4-endpoint=127.0.0.1:$port > "sim$n.log" 2>&1 &
          done
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && curl -fs http://127.0.0.1:8001/health && break; sleep 1; done
      - name: Soak de 30 min (dm-agent real; memória, goroutines, handles e fila)
        run: .venv/bin/python scripts/soak.py --minutes 30
      - name: Carga (banco dati_load, 500 coletores no WebSocket, parque < 1 s)
        run: .venv/bin/python scripts/load.py
      - name: Relatórios e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-load
          path: |
            var/soak/**/report.json
            var/soak/**/agent.log
            var/load/**
            *.log

  windows:
    name: Windows — build dos agentes e testes Go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - name: Build de todos os alvos
        shell: pwsh
        run: scripts/build-agent.ps1 -Version 0.0.0-ci
      - name: Binário roda
        shell: pwsh
        run: dist/windows-amd64/dm-agent.exe version
      - name: Testes Go com -race
        working-directory: agent
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  windows-installer:
    name: Windows — instalador (2 serviços, recuperação, atualização, desinstalação)
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/dati_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:root@127.0.0.1:5432/dati_ci
      APP_ENV: test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PostgreSQL do runner e API
        shell: pwsh
        run: |
          $svc = Get-Service postgresql* | Select-Object -First 1
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE DATABASE dati_ci" 2>&1
          python -m venv .venv
          .venv\Scripts\pip install -r backend\requirements-dev.lock
          .venv\Scripts\pip install --no-deps -e backend
          Push-Location backend; ..\.venv\Scripts\python -m app.cli migrate; Pop-Location
          Start-Process -FilePath .venv\Scripts\python.exe -WorkingDirectory backend -ArgumentList '-m', 'uvicorn', 'app.api.main:create_app', '--factory', '--port', '8000' -RedirectStandardOutput api.log -RedirectStandardError api-err.log
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:8000/api/health | Out-Null; break } catch { Start-Sleep 1 } }
        env:
          PGPASSWORD: root
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Instalador — testes completos (runner é administrador)
        shell: pwsh
        run: |
          $code = (.venv\Scripts\python scripts\ci_enrollment_code.py).Trim()
          scripts\test-installer.ps1 -Server http://127.0.0.1:8000 -Code $code -Full
